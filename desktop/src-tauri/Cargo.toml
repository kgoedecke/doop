[package]
name = "doop-desktop"
version = "0.14.0"
description = "Desktop shell for doop — a thin webview over the hosted app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# doop:// links: how a sign-in finished in the system browser reaches the app
# (src/lib/desktopAuth.ts). single-instance routes a link that Windows/Linux
# deliver by launching a second copy back into the running one.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# generate_context! embeds the `plugins` section of tauri.conf.json through it
# the page's menu bar arrives typed (src/app_menu.rs)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
tempfile = "3"
# Native "Save as" panel for PNG/JPG exports (the on_download handler in
# main.rs); used directly rather than through tauri-plugin-dialog because the
# download callback needs a synchronous answer on the UI thread.
rfd = "0.16"
# Self-update from the signed feed in tauri.conf.json (src/updates.rs); tokio
# only for the timer between scheduled checks.
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
# The check that a server picked in the app is a Doop server (src/server.rs);
# the same reqwest and ring-backed rustls the updater already links.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Repositioning the traffic lights over the web app's tab strip (main.rs);
# AppKit resets them on window events, so the shell moves them itself.
[target.'cfg(target_os = "macos")'.dependencies]
# MainThreadMarker, to read the event behind a menu pick (src/app_menu.rs)
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSButton", "NSControl", "NSEvent", "NSResponder", "NSView", "NSWindow"] }

[profile.release]
strip = true
lto = true
