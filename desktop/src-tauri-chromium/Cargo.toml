# The Chromium (CEF) build of the desktop shell. It compiles the very same
# sources as ../src-tauri (the [[bin]] and build script point there), against
# Tauri 3's CEF runtime instead of Tauri 2's system webview. Linking
# tauri-runtime-cef is what switches the code over: build.rs sees the runtime
# and sets `cfg(chromium)` (see the cfg(chromium) blocks in main.rs).
#
# On macOS this is the app that ships: the release workflow builds it as
# `doop` (design.doop.desktop), the same bundle the WebKit build was, so the
# WebKit app updates into it in place. Windows and Linux stay on the WebKit
# build. Tauri 3 and its CEF runtime are alphas, pinned exactly. Keep the
# shared dependencies below in step with ../src-tauri.
[package]
name = "doop-desktop-chromium"
version = "0.13.0"
description = "Desktop shell for doop on Chromium (CEF) — the same thin shell over the hosted app"
edition = "2021"
build = "../src-tauri/build.rs"
autobins = false

# the executable keeps the WebKit app's name: the updater relaunches the
# bundle by its old executable path once it has swapped the bundle
[[bin]]
name = "doop-desktop"
path = "../src-tauri/src/main.rs"

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "=3.0.0-alpha.5", features = [] }
tauri-runtime-cef = "=3.0.0-alpha.6"
tauri-plugin-opener = "=3.0.0-alpha.3"
tauri-plugin-deep-link = "=3.0.0-alpha.3"
tauri-plugin-single-instance = { version = "=3.0.0-alpha.3", features = ["deep-link"] }
tauri-plugin-updater = "=3.0.0-alpha.3"
serde_json = "1"
toml_edit = "0.25"
tempfile = "3"
rfd = "0.16"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
# reading the WebKit app's cookies and localStorage on the first launch (src/webkit_migration.rs)
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDate", "NSError", "NSGeometry", "NSHTTPCookie", "NSString", "NSURL", "block2"] }
# the migrated cookies go straight to Chromium's cookie manager, with their
# expiry; pinned to the version tauri-runtime-cef uses
cef = "=154.5.0"
objc2-web-kit = { version = "0.3", features = ["WKHTTPCookieStore", "WKNavigation", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "block2", "objc2-app-kit"] }

[profile.release]
strip = true
lto = true
