<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('doop-theme')
          var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var isDark =
            theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          if (isDark) {
            root.classList.add('dark')
            root.style.colorScheme = 'dark'
          } else {
            root.classList.remove('dark')
            root.style.colorScheme = 'light'
          }
        } catch (_) {}
      })()
    </script>
    <title>Doop — designed by Agents &amp; Humans</title>
    <meta
      name="description"
      content="Doop is a multiplayer design canvas where people and AI agents create side by side. Agents join through MCP as yours — every frame streams in live, with tasks, statuses and feedback flowing both ways."
    />
    <meta property="og:title" content="Doop — designed by Agents &amp; Humans" />
    <meta
      property="og:description"
      content="A multiplayer design canvas where people and AI agents create side by side. Connect any MCP agent and watch it design live."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
