# Vendored from DioxusLabs/blitz at 0f60502ea724ef703b34220b3847bb3483f70b5f (workspace
# dependencies resolved to that revision's versions) with local inline SVG fixes:
# - src/svg_use.rs: `<use>` references expand into clones of their targets as the `<use>`
#   element's children, so a sprite symbol in another `<svg>` renders and inherits `color`
#   and custom properties from the `<use>` site (the doopblitz bridge runs it after parsing).
# - src/stylo.rs: SVG paint presentation attributes (fill, stroke and their opacity, width,
#   cap, join, dash and rule companions) are presentational hints, so author CSS wins.
# - src/node/svg_source.rs: the inline SVG handed to usvg carries each element's computed
#   paint and opacity, drops `display: none` subtrees and `var()` declarations, writes an
#   expanded `<use>` as a `<g>`, and copies `url(#id)` targets from other `<svg>`s into <defs>.
#   Font properties and letter-spacing are carried the same way, so SVG text uses the page font.
# - src/svg_fonts.rs, src/document.rs, src/util.rs, src/net.rs: inline SVG text is laid out against
#   a per-document font database holding the `@font-face` fonts under their CSS family names; a
#   face is registered only if its `unicode-range` covers Basic Latin, since usvg cannot pick a
#   script subset per character.
# - src/stylo_to_parley.rs: `font-optical-sizing: auto`; a font's `opsz` axis follows the font size.
# - src/layout/construct.rs, src/node/text.rs, assets/default.css: empty inputs and textareas lay
#   out their `placeholder` in the `::placeholder` style (UA colour #757575).
# - src/document.rs (`has_pending_events`): a resource that has arrived but not been applied yet
#   counts as loading.
# Upstream: `<use>` is DioxusLabs/blitz#1327, SVG web fonts #1326, placeholders #1325; #1320,
# #1267 and #587 cover the CSS paint half. Everything else is the upstream crate; drop this directory once the fixes land upstream and remove the [patch]
# entry in ../../rust/Cargo.toml.
[package]
name = "blitz-dom"
description = "Blitz DOM implementation"
documentation = "https://docs.rs/blitz-dom"
version = "0.3.0-beta.2"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/dioxuslabs/blitz"
repository = "https://github.com/dioxuslabs/blitz"
categories = ["gui"]
edition = "2024"
rust-version = "1.91.0"

[features]
default = [
    "svg",
    "woff",
    "accessibility",
    "system-fonts",
    "file-input",
    "custom-widget"
]
custom-widget = ["dep:anyrender", "accessibility"]
tracing = ["dep:tracing"]
svg = ["dep:usvg", "dep:svgtypes"]
# WOFF decoding (using the "wuff" crate which is pure Rust)
woff = ["dep:wuff"]
accessibility = ["accesskit"]
system-fonts = ["parley/system"]
# complex-scripts: enable dictionary-based line-breaking
complex-scripts = ["parley/complex-scripts"]
autofocus = []
floats = ["taffy/float_layout", "stylo_taffy/floats"]
file-input = []
# Overlay-scrollbar thumb interaction (drag + hover tracking). Normally
# enabled through `blitz-paint/scrollbars`, which paints the thumbs.
scrollbars = []
parallel-construct = []
log-phase-times = ["debug_timer/enable"]

[dependencies]
# Blitz dependencies
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "0f60502ea724ef703b34220b3847bb3483f70b5f", default-features = false }
stylo_taffy = { git = "https://github.com/DioxusLabs/blitz", rev = "0f60502ea724ef703b34220b3847bb3483f70b5f", default-features = false, features = ["default"] }
debug_timer = { git = "https://github.com/DioxusLabs/blitz", rev = "0f60502ea724ef703b34220b3847bb3483f70b5f" }

# Servo dependencies
style = { version = "0.22.0", package = "stylo" }
selectors = { version = "0.41.0", package = "selectors" }
cssparser = { version = "0.38.0" }
style_config = { version = "0.22.0", package = "stylo_static_prefs" }
style_traits = { version = "0.22.0", package = "stylo_traits" }
style_dom = { version = "0.22.0", package = "stylo_dom" }
app_units = { version = "0.7.5" }
euclid = { version = "0.22" }
atomic_refcell = { version = "0.1.13" }
markup5ever = { version = "0.40.0" }
smallvec = { version = "1" }
thin-vec = { version = "0.2" }

# DioxusLabs dependencies
taffy = { git = "https://github.com/DioxusLabs/taffy", rev = "49152ca29664f9687c714c7732d88ff07d62110a", default-features = false, features = ["std", "flexbox", "flexbox_balance", "grid", "block_layout", "content_size", "calc", "detailed_layout_info"] }
anyrender = { version = "0.14.0", optional = true }

# Linebender/Fontations dependencies
accesskit = { version = "0.25", optional = true }
parley = { git = "https://github.com/linebender/parley", rev = "718dcb721941fd8e72128833122d31f5a4e80504", default-features = false, features = ["std"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
linebender_resource_handle = { version = "0.1" }
color = { version = "0.3" }
kurbo = { version = "0.13.1" }

# Other dependencies
slotmap = { version = "1.0.7" }
bitflags = { version = "2.8.0" }
tracing = { version = "0.1.40", optional = true }
rayon = { version = "1" }

# Media & Decoding
image = { version = "0.25.6", default-features = false }
usvg = { version = "0.48.1", optional = true }
svgtypes = { version = "0.16.1", optional = true }
wuff = { version = "0.2", optional = true }
html-escape = { version = "0.2.13" }
percent-encoding = { version = "2.3.1" }

# IO & Networking
url = { version = "2.5.0" }

# Input
keyboard-types = { version = "0.7" }
cursor-icon = { version = "1" }
thread_local = { version = "1" }

# WASM
web-time = { version = "1" }

# HACK: Blitz doesn't need to depend on objc2 directly. But this feature flag is necessary
# to prevent debug builds from panicking.
[target.'cfg(any(target_vendor = "apple"))'.dependencies]
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }
