# Vendored from crates.io anyrender_skia 0.12.0 with one local fix:
# - src/scene.rs: variable font coordinates reach Skia in design space through the font's
#   `avar` mapping (`design_coordinates`); the upstream conversion interpolated below-default
#   values from the wrong end and ignored `avar`, so a light weight of a font whose default is
#   Black (Fraunces) drew heavy and 700 drew hairline.
# Everything else is the published crate; drop this directory once the fix ships and remove
# the [patch.crates-io] entry in ../../rust/Cargo.toml.
# THIS FILE IS AUTOMATICALLY GENERATED BY CARGO
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
name = "anyrender_skia"
version = "0.12.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Skia backend for anyrender"
homepage = "https://github.com/dioxuslabs/anyrender"
documentation = "https://docs.rs/anyrender_skia"
readme = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/dioxuslabs/anyrender"
resolver = "2"

[features]
log_frame_times = [
    "debug_timer/enable",
    "pixels_window_renderer?/log_frame_times",
    "softbuffer_window_renderer?/log_frame_times",
]
pixels_window_renderer = ["dep:pixels_window_renderer"]
softbuffer_window_renderer = ["dep:softbuffer_window_renderer"]
vulkan = ["skia-safe/vulkan"]

[lib]
name = "anyrender_skia"
path = "src/lib.rs"

[dependencies.anyrender]
version = "0.14.0"

[dependencies.debug_timer]
version = "0.1.1"

[dependencies.hashbrown]
version = "0.17.0"

[dependencies.kurbo]
version = "0.13.1"

[dependencies.oaty]
version = "0.2"

[dependencies.peniko]
version = "0.6"

[dependencies.pixels_window_renderer]
version = "0.9.0"
optional = true

[dependencies.raw-window-handle]
version = "0.6.0"

[dependencies.skia-safe]
version = "0.153.3"

[dependencies.skrifa]
version = "0.44"

[dependencies.softbuffer_window_renderer]
version = "0.9.0"
optional = true

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2]
version = "0.6.3"
default-features = false

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2-core-foundation]
version = "0.3.2"
default-features = false

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2-metal]
version = "0.3.2"
features = [
    "MTLCommandBuffer",
    "MTLCommandQueue",
    "MTLDrawable",
    "MTLPixelFormat",
]
default-features = false

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.objc2-quartz-core]
version = "0.3.2"
features = [
    "objc2-core-foundation",
    "objc2-metal",
    "CAMetalLayer",
]
default-features = false

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.skia-safe]
version = "0.153.3"
features = [
    "ganesh",
    "metal",
]

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies.ash]
version = "^0.38.0"

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies.ash-window]
version = "0.13.0"

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies.gl]
version = "0.14.0"

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies.glutin]
version = "0.32.3"
features = [
    "default",
    "wgl",
    "egl",
]

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies.skia-safe]
version = "0.153.3"
features = ["gl"]

[target.'cfg(target_os = "ios")'.dependencies.objc2-ui-kit]
version = "0.3.2"
features = [
    "objc2-quartz-core",
    "UIView",
    "UIResponder",
]
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3.2"
features = [
    "objc2-quartz-core",
    "NSView",
    "NSResponder",
]
default-features = false

[target."cfg(windows)".dependencies.skia-safe]
version = "0.153.3"
features = ["textlayout"]
