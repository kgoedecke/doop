<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- A classic script, so the stub is in place before the module below
         imports the auth client: better-auth captures window.fetch when the
         client is created, not per request. -->
    <script>
      /* The sign-up POST answers with whatever the test last set: one of
         better-auth's own error bodies, or the JSON a platform edge sends when
         it answers instead of the app (Railway's, whose `code` is a number). */
      var signUpResponse = { status: 500, body: {} }
      window.setSignUpResponse = function (status, body) {
        signUpResponse = { status: status, body: body }
      }
      /* What PostHog's exception autocapture reports from here: the submit
         handler runs inside a promise, so a throw in it surfaces as an
         unhandled rejection rather than a page error. */
      window.rejections = []
      window.addEventListener('unhandledrejection', function (event) {
        window.rejections.push(String(event.reason))
      })
      var realFetch = window.fetch.bind(window)
      function jsonResponse(body, status) {
        return new Response(JSON.stringify(body), { status: status, headers: { 'content-type': 'application/json' } })
      }
      window.fetch = function (input, init) {
        /* better-auth hands fetch a URL object; the app's own calls pass strings */
        var url = typeof input === 'string' ? input : input instanceof Request ? input.url : String(input)
        /* this deploy has no SSO or social providers configured */
        if (url.includes('/api/oidc-config'))
          return Promise.resolve(jsonResponse({ enabled: false, google: false, microsoft: false, apple: false }, 200))
        if (url.includes('/api/auth/sign-up/email'))
          return Promise.resolve(jsonResponse(signUpResponse.body, signUpResponse.status))
        return realFetch(input, init)
      }
    </script>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { AuthPage } from '/src/pages/AuthPage.tsx'
      import '/src/styles.css'

      createRoot(document.getElementById('root')).render(React.createElement(AuthPage))
    </script>
  </body>
</html>
