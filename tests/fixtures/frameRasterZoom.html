<!doctype html>
<html>
  <body>
    <script type="module">
      import { FRAME_BOOTSTRAP } from '/src/lib/frameRuntime.ts'
      import { FRAME_DOCUMENTS_TAKE_ZOOM_AS_DENSITY, counterZoom, layoutZoomFor } from '/src/lib/layoutZoom.ts'

      /* a frame whose footer is anchored to the bottom of a 100vh column — the
         layout that lost its footer past 100% canvas zoom */
      const HTML = `<!doctype html><html><head><style>
        * { margin: 0; box-sizing: border-box }
        body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding: 20px }
        .foot { margin-top: auto; height: 30px }
      </style></head><body><h1>Hello</h1><p>Body copy.</p><div class="foot">foot</div></body></html>`

      const DESIGN = { width: 400, height: 300 }
      window.messages = []
      window.addEventListener('message', (ev) => window.messages.push(ev.data))

      /* the Stage's world, laid out at the settled canvas zoom */
      const world = document.createElement('div')
      world.style.cssText = 'position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform'
      document.body.style.margin = '0'
      document.body.appendChild(world)

      /* the runtime's iframe, as FrameView draws it */
      const frame = document.createElement('iframe')
      frame.setAttribute('data-doop-frame', '')
      frame.sandbox = 'allow-scripts'
      frame.srcdoc = FRAME_BOOTSTRAP
      frame.style.cssText = `display:block;border:0;width:${DESIGN.width}px;height:${DESIGN.height}px;transform-origin:0 0`
      world.appendChild(frame)

      /* a plain iframe that can report what the document sees */
      const probe = document.createElement('iframe')
      probe.style.cssText = frame.style.cssText
      probe.srcdoc =
        '<!doctype html><body><script>' +
        "addEventListener('message', (e) => { if (e.data === 'q') parent.postMessage({ probe: { innerWidth, innerHeight, dpr: devicePixelRatio } }, '*') })" +
        '</scr' +
        'ipt></body>'
      world.appendChild(probe)

      const waitFor = (pred, timeout = 5000) =>
        new Promise((resolve, reject) => {
          const t0 = Date.now()
          const tick = () => {
            const hit = window.messages.find(pred)
            if (hit) return resolve(hit)
            if (Date.now() - t0 > timeout) return reject(new Error('timeout'))
            setTimeout(tick, 10)
          }
          tick()
        })
      const nextPaint = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)))
      let req = 0

      /** where a selector sits, in design px, as the runtime reports it */
      window.rect = async (selector) => {
        const reqId = `r${++req}`
        frame.contentWindow.postMessage({ type: 'doop:locate', reqId, selector }, '*')
        const m = await waitFor((d) => d?.type === 'doop:located' && d.reqId === reqId)
        return m.rect
      }
      /** the plain iframe's view of its viewport and pixel density */
      window.viewport = async () => {
        window.messages = window.messages.filter((d) => !d?.probe)
        probe.contentWindow.postMessage('q', '*')
        return (await waitFor((d) => d?.probe)).probe
      }
      /** the path FrameView takes in this browser */
      window.shippedPath = FRAME_DOCUMENTS_TAKE_ZOOM_AS_DENSITY ? 'density' : 'counter'
      /** settle the canvas at zoom k: the world takes it as its layout zoom,
          and both iframes either take it as pixel density (Chromium) or undo
          it (zoom 1/k, scale k: WebKit), the way Stage and FrameView do */
      window.zoom = async (zoom, path = window.shippedPath) => {
        const k = layoutZoomFor(zoom, 16, path === 'density')
        world.style.zoom = String(k)
        for (const el of [frame, probe]) {
          el.style.zoom = path === 'density' ? '' : String(counterZoom(k))
          el.style.transform = path === 'density' ? '' : `scale(${k})`
        }
        await nextPaint()
        const box = frame.getBoundingClientRect()
        return { width: box.width, height: box.height }
      }

      await waitFor((d) => d?.type === 'doop:frame-ready', 60_000)
      frame.contentWindow.postMessage({ type: 'doop:html', html: HTML }, '*')
      await new Promise((r) => (probe.contentWindow.document ? r() : (probe.onload = r)))
      await nextPaint()
      window.testReady = true
    </script>
  </body>
</html>
