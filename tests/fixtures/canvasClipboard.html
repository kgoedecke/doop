<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { CanvasPage } from '/src/pages/CanvasPage.tsx'
      import { TooltipProvider } from '/src/components/ui/tooltip.tsx'
      import { pickedSelectors, useStore } from '/src/lib/store.ts'
      import { clearHistory, undo } from '/src/lib/history.ts'
      import '/src/styles.css'

      window.canvasClipboardHarness = {
        seed: (frames, role = 'edit') => {
          clearHistory()
          useStore.getState().setCanvas({ id: 'c', name: 'Clipboard', frames, role, createdAt: 0, updatedAt: 0 })
          useStore.getState().select(null)
          useStore.getState().setLayersOpen(false)
          useStore.setState({ uiHidden: true })
        },
        pick: (...selectors) => {
          const store = useStore.getState()
          store.select('f')
          for (const selector of selectors) store.toggleElement({ frameId: 'f', selector })
        },
        frames: () => useStore.getState().canvas.frames,
        picked: () => pickedSelectors(useStore.getState()),
        lockFrame: () => useStore.getState().patchFrameLocal('f', { locked: true }),
        notice: () => useStore.getState().notice?.text,
        undo,
      }
      createRoot(document.getElementById('root')).render(
        React.createElement(TooltipProvider, null, React.createElement(CanvasPage, { canvasId: 'c' })),
      )
    </script>
  </body>
</html>
