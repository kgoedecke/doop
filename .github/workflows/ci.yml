name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR supersedes the run in flight; main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PRs land on main as a squash, so the PR *title* becomes the commit subject —
  # that, not the branch's commits, is what has to satisfy commitlint. The local
  # commit-msg hook can't see it, so this is the only place it gets checked.
  commit-message:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Via env, never inlined into the script: a PR title is attacker-controlled text.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx --bun commitlint

  # The checks run as parallel jobs so wall-clock is the slowest one, not the
  # sum. Install is ~5s per job (setup-bun restores ~/.bun/install/cache keyed
  # on bun.lock), so the duplication is cheap.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run doc-lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The Docker build stage uses Bun even for commands named `node`.
      - run: bun run --bun build

  # The suite boots a real server per integration file, which is CPU-bound on
  # the 2-vCPU runner; sharding across runners is what brings the step down.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The browser tests drive the Chrome named in .chrome-version, not the one
      # the runner image happens to ship: an image update must not be able to
      # change what the suite runs on without a commit here.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/doop-chrome
          key: chrome-${{ runner.os }}-${{ hashFiles('.chrome-version') }}
      - name: Install the pinned Chrome
        run: |
          ./node_modules/.bin/browsers install "chrome@$(cat .chrome-version)" --path ~/.cache/doop-chrome > "$RUNNER_TEMP/chrome-install"
          path=$(awk '{ print $2 }' "$RUNNER_TEMP/chrome-install")
          "$path" --version
          echo "CHROME_PATH=$path" >> "$GITHUB_ENV"
          # Ubuntu 24.04 lets only the browsers it has an AppArmor profile for
          # make the user namespaces Chrome's sandbox needs
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns >/dev/null
      # `bun run test`, not `bun test`: the suite is vitest, and `bun test`
      # would run Bun's own runner against the same files
      - run: bun run test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # canvas-actors: the generated client matches src/actor.ts, and the
  # end-to-end test runs against a local actor runtime (Bun 1.4.2+)
  test-actors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: bun install --frozen-lockfile
      - run: bun run actors:check
      - run: bun run test:actors -- tests/canvasActors.test.ts

  # One status that stands for every shard, so a required check or a merge
  # queue names "tests" rather than each "test (N)"; renumbering the matrix
  # never silently drops a protection.
  tests:
    needs: [test, test-actors]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success && test "${{ needs.test-actors.result }}" = success
