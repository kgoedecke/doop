name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # PRs land on main as a squash, so the PR *title* becomes the commit subject —
  # that, not the branch's commits, is what has to satisfy commitlint. The local
  # commit-msg hook can't see it, so this is the only place it gets checked.
  commit-message:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Via env, never inlined into the script: a PR title is attacker-controlled text.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx --bun commitlint

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # setup-bun restores ~/.bun/install/cache keyed on bun.lock, so this is
      # already the cached path — no separate cache step
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun run cantelop:install
      - run: bun run cantelop:check
      - run: bun run cantelop:test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run doc-lint
      - run: bun run build
      # `bun run test`, not `bun test`: the suite is vitest, and `bun test`
      # would run Bun's own runner against the same files
      - run: bun run test

  claude-runtime-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --cwd cantelop --frozen-lockfile
      - name: Install Cantelop CLI
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' \
            https://github.com/stepandel/homebrew-tap/releases/download/cantelop-v0.11.3/cantelop_0.11.3_linux_amd64.tar.gz \
            -o /tmp/cantelop.tar.gz
          echo '35436d7827d9d85e52a3d2a13a0a566142569704782304960be9d3af8cc5793a  /tmp/cantelop.tar.gz' | sha256sum --check --strict
          mkdir -p /tmp/cantelop-cli "$HOME/.local/bin"
          tar -xzf /tmp/cantelop.tar.gz -C /tmp/cantelop-cli
          install -m 0755 /tmp/cantelop-cli/cantelop "$HOME/.local/bin/cantelop"
      - name: Add Cantelop to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun run cantelop:build
