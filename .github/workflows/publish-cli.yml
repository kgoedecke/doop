# Publishes the doop CLI to npm as @doop-design/cli (scripts/pack-doop-cli.mjs).
#
# Push the tag `cli-v<version>`, where <version> is the one in cli/package.json (the CLI's own,
# bumped when the CLI changes), once a server the CLI needs is deployed. A manual run packs the
# CLI and uploads it as an artifact without publishing, to look at what would go out.
#
# Publishing uses npm trusted publishing: the package names this repository and this workflow
# file as its trusted publisher on npmjs.com, so no npm token is stored here. What npm asks for
# (docs.npmjs.com/trusted-publishers): a GitHub-hosted runner, npm 11.5.1 or newer, `id-token:
# write`, and a `repository.url` in the package's manifest that is this repository
# (cli/package.json). The package's first publish is done by hand (.context/RELEASE.md),
# since a trusted publisher is set on a package that exists.
name: Publish CLI

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: bun run pack:cli
      - name: Check the tag is this version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./cli/dist/package.json').version")
          if [ "$GITHUB_REF_NAME" != "cli-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected cli-v$version)"
            exit 1
          fi
      - name: Run the packed CLI
        run: node cli/dist/doop.mjs --version
      - uses: actions/upload-artifact@v4
        with:
          name: doop-cli
          path: cli/dist
      - name: Publish to npm
        if: github.event_name == 'push'
        run: |
          npm install -g npm@latest
          npm publish ./cli/dist --access public
