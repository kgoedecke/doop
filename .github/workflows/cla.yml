name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/kgoedecke/doop/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: kgoedecke,bot*,*[bot],Claude*
          # Default is true, which locks every merged PR. release-please then cannot comment on or
          # relabel its own merged release PR, so every later run aborts with "untagged, merged
          # release PRs outstanding" and no new release PR is ever opened.
          lock-pullrequest-aftermerge: false
