# Builds the distributable desktop installers: a universal macOS DMG (Apple
# Silicon + Intel) and a Windows NSIS setup .exe.
# - Tag `desktop-v*` → builds both, then one release job attaches them to a
#   GitHub Release. The release is only created once both builds succeeded,
#   so a tag never ends up published with a single installer.
# - Manual dispatch → builds and uploads the installers as workflow artifacts.
# - PRs touching this file → same as dispatch, so the pipeline stays validated.
#
# macOS signing + notarization happen automatically once the APPLE_* repo
# secrets exist (see desktop/README.md). Until then the DMG is unsigned: it
# works, but downloaders must approve it in System Settings → Privacy &
# Security. The Windows app and installer are signed with Azure Artifact
# Signing on tag and dispatch builds once the AZURE_CLIENT_ID and
# AZURE_TENANT_ID repo variables exist (see desktop/README.md); PR builds and
# repos without them stay unsigned.
name: Desktop Release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-release.yml'
      - '.github/actions/setup-desktop/**'

permissions:
  contents: write

jobs:
  dmg-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-desktop
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build DMG (signed + notarized when APPLE_* secrets are set)
        working-directory: desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # unset secrets take precedence over none at all: tauri treats an
          # empty env var as configured and fails, so drop the empty ones
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::warning::APPLE_* secrets not set — building an UNSIGNED dmg (System Settings → Open Anyway required)"
          fi
          bunx tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: doop-dmg
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  nsis-windows:
    runs-on: windows-latest
    # Azure trusts this repo's `desktop-release` environment through a
    # federated credential, so signing needs no stored secret. PR builds stay
    # unsigned, and so does a repo without the AZURE_* variables (forks).
    environment: ${{ github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != '' && 'desktop-release' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      SIGN: ${{ github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-desktop
      - name: Log in to Azure
        if: env.SIGN == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Set up Artifact Signing
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $client = Join-Path $env:RUNNER_TEMP artifact-signing
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/1.0.146 -OutFile "$client.zip"
          if ((Get-FileHash "$client.zip" -Algorithm SHA256).Hash -ne '7761E5D8F31E54B764DA21D33CD8B0A2940E1B05526C7DFCB5E94B0431426F70') {
            throw 'Microsoft.ArtifactSigning.Client checksum mismatch'
          }
          Expand-Archive "$client.zip" $client
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          # GitHub's OIDC assertion outlives neither a cold Rust compile nor the
          # wait until the first file is signed, so fetch the signing token now:
          # the Azure CLI caches it (about an hour) and the dlib reuses it
          az account get-access-token --scope https://codesigning.azure.net/.default --output none
          if ($LASTEXITCODE -ne 0) { throw 'could not get an Artifact Signing token' }
          # only the Azure CLI session from the login step may authenticate
          $metadata = Join-Path $env:RUNNER_TEMP artifact-signing.json
          @{
            Endpoint = 'https://eus.codesigning.azure.net'
            CodeSigningAccountName = 'Doop'
            CertificateProfileName = 'doop-public'
            ExcludeCredentials = @(
              'EnvironmentCredential', 'ManagedIdentityCredential', 'WorkloadIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content $metadata
          $config = Join-Path $env:RUNNER_TEMP tauri-sign.json
          @{ bundle = @{ windows = @{ signCommand = @{
            cmd = 'pwsh'
            args = @('-NoProfile', '-File', "$env:GITHUB_WORKSPACE\desktop\scripts\sign-windows.ps1", '%1')
          } } } } | ConvertTo-Json -Depth 5 | Set-Content $config
          "SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV
          "ARTIFACT_SIGNING_DLIB=$client\bin\x64\Azure.CodeSigning.Dlib.dll" >> $env:GITHUB_ENV
          "ARTIFACT_SIGNING_METADATA=$metadata" >> $env:GITHUB_ENV
          "TAURI_SIGN_CONFIG=$config" >> $env:GITHUB_ENV
      - name: Build Windows installer (signed when Artifact Signing is set up)
        working-directory: desktop
        shell: bash
        run: |
          if [ "$SIGN" = true ]; then
            bunx tauri build --bundles nsis --config "$TAURI_SIGN_CONFIG"
          else
            echo "::warning::not signing the Windows installer (PR build, or AZURE_* variables not set)"
            bunx tauri build --bundles nsis
          fi
      - name: Verify signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          # the installer is what ships; the app exe inside it was signed while
          # bundling (target/release keeps an unsigned copy, so it is not checked)
          foreach ($file in Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe) {
            & $env:SIGNTOOL_PATH verify /pa /v $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($file.Name) is not signed" }
          }
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: doop-windows-setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [dmg-macos, nsis-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: installers
          merge-multiple: true
      - name: Attach installers to release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          files: |
            installers/*.dmg
            installers/*.exe
          fail_on_unmatched_files: true
