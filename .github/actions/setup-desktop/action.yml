# Toolchain for building the Tauri desktop shell: the WebKitGTK build deps on
# Linux, bun (for @tauri-apps/cli), a stable Rust with the requested targets,
# a Rust build cache shared across workflows and jobs on the same OS, and the
# desktop/ node_modules. The macOS jobs build the Chromium crate
# (desktop/src-tauri-chromium), which also needs ninja for CEF's C++ wrapper
# and the CEF binary distribution, cached between runs.
name: Set up desktop toolchain
description: Bun, Rust (+targets), cargo cache and desktop/ dependencies for tauri build

inputs:
  targets:
    description: Comma-separated extra Rust targets (e.g. aarch64-apple-darwin,x86_64-apple-darwin)
    required: false
    default: ''
  workspace:
    description: The crate to build, desktop/src-tauri (WebKit) or desktop/src-tauri-chromium (macOS)
    required: false
    default: desktop/src-tauri

runs:
  using: composite
  steps:
    # WebKitGTK and friends for the Linux webview, plus what the AppImage
    # bundler shells out to (patchelf, file)
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
          libssl-dev libxdo-dev patchelf file
    - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
    # pinned by commit like every other action; the toolchain to install
    # is then passed explicitly (the @stable ref only selected it by name)
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      with:
        toolchain: stable
        targets: ${{ inputs.targets }}
    - uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7
      with:
        workspaces: ${{ inputs.workspace }}
        # one cache per OS and crate instead of one per job, so the release
        # build restores what the PR build compiled (and vice versa)
        shared-key: ${{ inputs.workspace == 'desktop/src-tauri' && 'desktop' || 'desktop-chromium' }}
    # cef-dll-sys builds CEF's C++ wrapper with cmake (preinstalled) and ninja
    - if: inputs.workspace == 'desktop/src-tauri-chromium'
      shell: bash
      run: brew install ninja
    # the CEF binary distribution (about 300 MB per architecture), keyed on the
    # cef-dll-sys version that names it
    - if: inputs.workspace == 'desktop/src-tauri-chromium'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/Library/Caches/tauri-cef
        key: tauri-cef-${{ runner.os }}-${{ hashFiles('desktop/src-tauri-chromium/Cargo.lock') }}
        restore-keys: tauri-cef-${{ runner.os }}-
    - run: bun install --frozen-lockfile
      shell: bash
      working-directory: desktop
